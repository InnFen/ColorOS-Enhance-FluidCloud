# Builds the module APK on GitHub's servers.
# Push this source to your own GitHub repository, open Actions, pick "Build APK" and press "Run workflow"
# (it also runs on every push to the pixel-lockscreen branch). The APK is in the run's Artifacts.
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [pixel-lockscreen]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest ships Android cmdline-tools but sdkmanager is not on PATH.
      # (android-actions/setup-android still installs the retired "tools" package and fails.)
      - name: Install Android SDK 37 and Build Tools 37.0.0
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -n1)
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          # API 37 is published as "platforms;android-37.0"; link the name AGP looks for.
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Signing key
        run: |
          mkdir -p .local
          if [ -n "${{ secrets.DEBUG_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > .local/debug.p12
            PASS="${{ secrets.DEBUG_KEYSTORE_PASSWORD }}"
          else
            PASS=$(openssl rand -base64 24 | tr -d '/+=')
            keytool -genkeypair -storetype PKCS12 -keystore .local/debug.p12 \
              -alias pixellock -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Pixel Lockscreen"
          fi
          printf 'storePassword=%s\nkeyAlias=pixellock\nkeyPassword=%s\n' "$PASS" "$PASS" > .local/debug.properties

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: pixel-lockscreen-apk
          path: app/build/outputs/apk/debug/*.apk
